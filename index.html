<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나는 편의점 점장이다</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#122029">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="편의점 점장">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap">
<style>
/* layout: the game fills the window; HUD, hint, panels and the touch pad float over it */
:root{
  --night:#122029; --panel:#1a2e3a; --line:#2d4858; --ink:#eef4f1; --muted:#93abb6;
  --sign:#ffc23d; --tag:#ef4f4f; --mint:#4fd1a5;
  --display:'Black Han Sans','Noto Sans KR','Malgun Gothic',sans-serif;
  --body:'Noto Sans KR','Malgun Gothic',system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{background:var(--stagebg,var(--night));color:var(--ink);margin:0;height:100%;overflow:hidden}
body{font-family:var(--body)}
.app{position:fixed;inset:0}
.hud{position:absolute;z-index:5;top:max(8px,env(safe-area-inset-top,0px));left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;font-variant-numeric:tabular-nums}
.hud>*{pointer-events:auto}
.hud .hbtns{flex:none}
.hud button{white-space:nowrap}
.hstats{display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;background:rgba(14,18,26,.78);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:6px 14px}
.hud .brand{font-family:var(--display);font-size:16px;color:var(--sign);letter-spacing:.02em}
.hud .stat{display:flex;flex-direction:column;line-height:1.15}
.hud .stat small{font-size:10px;color:var(--muted);letter-spacing:.08em}
.hud .stat b{font-size:15px}
.stars{color:var(--sign)}
.stam{width:70px;height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}
.stam i{display:block;height:100%;background:var(--mint)}
.hud button{background:rgba(14,18,26,.78);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.14);color:var(--ink);border-radius:10px;padding:7px 10px;font:inherit;font-size:12px;cursor:pointer}
.hud button:focus-visible,.screen button:focus-visible,.mini button:focus-visible{outline:2px solid var(--sign);outline-offset:2px}
.stage{position:absolute;inset:0;overflow:hidden;background:var(--stagebg,#000)}
canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,calc(100dvh * 1.6));height:auto;aspect-ratio:16/10;touch-action:none}
.hint{position:absolute;z-index:4;left:50%;bottom:max(10px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:max-content;max-width:calc(100vw - 24px);font-size:14px;color:#eef4f1;text-align:center;background:rgba(14,18,26,.78);border-radius:999px;padding:6px 16px;pointer-events:none}
.hint:empty{display:none}
.hint b{color:var(--sign)}
.screen{position:absolute;inset:0;z-index:30;display:flex;align-items:flex-start;justify-content:center;background:rgba(10,20,27,.35);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.card{margin:auto}
.card{max-width:540px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;background:rgba(14,18,26,.9);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:22px 20px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.card h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,6vw,52px);margin:0;color:var(--sign);text-wrap:balance;text-shadow:0 3px 0 #9a5d00}
.card h2{font-family:var(--display);font-weight:400;font-size:clamp(22px,4vw,32px);margin:0;color:var(--sign)}
.card p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
.tag{display:inline-block;background:var(--tag);color:#fff;font-size:11px;font-weight:700;letter-spacing:.1em;padding:3px 8px;border-radius:3px}
.btn{background:var(--sign);color:#2a1a00;border:0;border-radius:8px;padding:12px 26px;font-family:var(--display);font-size:20px;cursor:pointer;box-shadow:0 4px 0 #9a5d00}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #9a5d00}
.report{width:100%;display:grid;grid-template-columns:1fr auto;gap:6px 16px;text-align:left;font-size:14px;font-variant-numeric:tabular-nums;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px}
.report dt{color:var(--muted)} .report dd{margin:0;text-align:right;font-weight:700}
.report .sum{border-top:1px dashed var(--line);padding-top:6px}
.shop{width:100%;display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--panel);border:1px solid var(--sign);border-radius:8px;padding:12px 14px}
.shop-head{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-variant-numeric:tabular-nums}
.shop-head>b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--sign)}
.up{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.up-txt{flex:1;min-width:0;display:flex;flex-direction:column;font-size:13px}
.up-txt small{color:var(--muted);font-size:11px;font-weight:400}
.up button{flex:none;min-width:86px;background:var(--sign);color:#2a1a00;border:0;border-radius:6px;padding:7px 10px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.up button:disabled{background:var(--line);color:var(--muted);cursor:default}
.up.owned button:disabled{background:none;border:1px solid var(--mint);color:var(--mint)}
.up button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.mini{position:absolute;z-index:20;top:calc(max(8px,env(safe-area-inset-top,0px)) + 56px);left:50%;transform:translateX(-50%);width:min(560px,94%);max-height:calc(100% - 16px);overflow:auto;background:var(--panel);border:2px solid var(--sign);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.mini.shake{animation:shake .25s}
@keyframes shake{25%{transform:translateX(calc(-50% - 6px))}75%{transform:translateX(calc(-50% + 6px))}}
.mhead{display:flex;align-items:center;gap:10px;font-size:13px}
.mhead span{flex:1;min-width:0}
.pbar{width:90px;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--mint)}
.mtitle{font-family:var(--display);font-size:20px;color:var(--sign);display:flex;justify-content:space-between;align-items:baseline}
.mtitle small{font-family:var(--body);font-size:12px;color:var(--muted)}
.items{display:flex;flex-wrap:wrap;gap:8px}
.item{flex:1 1 110px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:8px;align-items:center;background:var(--night);border:1px solid var(--line);border-radius:8px;padding:8px}
.item .ic{grid-row:span 2;font-size:24px}
.item .nm{font-size:13px;font-weight:700}
.item .pr{font-size:11px;color:var(--muted)}
.item .key{grid-column:1/3;text-align:center;font-size:22px;font-weight:900;margin-top:4px;color:var(--ink)}
.item.cur{border-color:var(--sign);background:#2a3a22}
.item.cur .key{color:var(--sign)}
.item.done{opacity:.45}
.item.done .key{color:var(--mint)}
.mhelp{margin:0;font-size:12px;color:var(--muted);text-align:center}
.heat{position:relative;height:26px;background:var(--night);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.heat .zone{position:absolute;top:0;bottom:0;background:rgba(79,209,165,.45);border-left:2px solid var(--mint);border-right:2px solid var(--mint)}
.heat .ndl{position:absolute;top:-2px;bottom:-2px;width:4px;margin-left:-2px;background:var(--tag)}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts button{flex:1 1 120px;background:var(--night);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:10px;font:inherit;font-size:16px;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.opts button:hover{border-color:var(--sign)}
.opts button small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.mfoot{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.mfoot b{color:var(--ink);font-size:16px}
.alarm{background:var(--tag);color:#fff;font-weight:700;font-size:13px;text-align:center;border-radius:6px;padding:5px;animation:blink .5s infinite alternate}
@keyframes blink{to{opacity:.55}}
.banner{position:absolute;left:50%;top:calc(max(8px,env(safe-area-inset-top,0px)) + 56px);transform:translateX(-50%);z-index:2;background:var(--sign);color:#2a1a00;font-weight:900;font-size:14px;padding:8px 16px;border-radius:999px;box-shadow:0 4px 0 #9a5d00;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.order{position:absolute;z-index:3;left:max(12px,env(safe-area-inset-left,0px));top:calc(max(8px,env(safe-area-inset-top,0px)) + 64px);background:var(--panel);border:2px solid var(--mint);border-radius:8px;padding:8px 10px;font-size:12px;min-width:150px;display:flex;flex-direction:column;gap:3px;font-variant-numeric:tabular-nums;pointer-events:none}
.order b{color:var(--mint);font-size:13px}
.order .got{color:var(--muted);text-decoration:line-through}
.order .go{color:var(--sign);font-weight:700}
.order .tbar{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.order .tbar i{display:block;height:100%;background:var(--mint)}
.pad{display:none;position:absolute;inset:0;z-index:6;pointer-events:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
@media (pointer:coarse){.pad{display:block}}
.stick{position:absolute;left:max(20px,env(safe-area-inset-left,0px));bottom:max(20px,env(safe-area-inset-bottom,0px));width:140px;height:140px;border-radius:50%;background:rgba(14,18,26,.35);border:2px solid rgba(255,255,255,.28);touch-action:none;pointer-events:auto}
.stick .ar{position:absolute;color:var(--muted);font-size:14px;pointer-events:none}
.stick .u{top:8px;left:50%;transform:translateX(-50%)}.stick .d{bottom:8px;left:50%;transform:translateX(-50%)}
.stick .l{left:10px;top:50%;transform:translateY(-50%)}.stick .r{right:10px;top:50%;transform:translateY(-50%)}
.knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid rgba(255,255,255,.6);pointer-events:none}
.pad button{background:rgba(14,18,26,.45);border:2px solid rgba(255,255,255,.3);color:#fff;font-size:20px;font-weight:700;touch-action:none}
.pad button:active,.pad button.on{background:rgba(255,255,255,.3)}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
/* a game, not a document: no text selection or long-press copy menu */
.app{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{-webkit-touch-callout:none}
.hbtns{display:flex;gap:6px}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-width:0;background:var(--night);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 6px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.seg button small{font-size:10px;font-weight:400;color:var(--muted);text-align:center}
.seg button.on{border-color:var(--sign);background:#3a3218;color:var(--sign)}
.up button.hired{background:none;border:1px solid var(--mint);color:var(--mint)}
.shop .note{margin:0;font-size:11px;color:var(--muted)}
.code-row{display:flex;gap:6px;align-items:center}
.code-row input{flex:1;min-width:0;background:var(--night);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:7px 8px;font:12px ui-monospace,Consolas,monospace;-webkit-user-select:text;user-select:text}
.code-row button{flex:none;min-width:86px;background:var(--sign);color:#2a1a00;border:0;border-radius:6px;padding:7px 10px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.code-msg{font-size:12px;color:var(--mint);min-height:1em;margin:0}
.code-msg.bad{color:var(--tag)}
.mcancel{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer}
/* phones: overlays use the whole screen, checkout panel floats at the top */
@media (pointer:coarse),(max-width:700px){
  .mini{max-height:62dvh;padding:10px 12px;gap:8px}
  .item{flex-basis:80px;padding:6px}
  .item .ic{font-size:20px}
  .item .key{font-size:20px}
  .hstats{gap:2px 12px;padding:5px 10px}
  .hud .brand{display:none}
  .hud .stat b{font-size:13px}
  .hint{font-size:12px}
}
@media (pointer:coarse) and (orientation:landscape){
  .hint{max-width:calc(100vw - 380px)}
  .mini{width:min(560px,calc(100vw - 340px));max-height:calc(100dvh - 70px)}
}
@media (pointer:coarse) and (orientation:portrait){
  .hint{bottom:auto;top:calc(50% - 31.25vw - 42px)}
  .order{top:calc(50% + 31.25vw + 8px)}
}
.abtns{position:absolute;right:max(20px,env(safe-area-inset-right,0px));bottom:max(20px,env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:flex-end;pointer-events:auto}
.abtns button{width:70px;height:70px;border-radius:50%;font-size:14px}
.abtns [data-k=action]{background:rgba(255,194,61,.92);color:#2a1a00;border-color:rgba(255,255,255,.55);width:92px;height:92px;font-size:16px}
.howto{width:100%;text-align:left}
.howto summary{cursor:pointer;color:var(--sign);font-weight:700;font-size:14px;text-align:center;list-style:none}
.howto summary::-webkit-details-marker{display:none}
.howto .help{margin-top:8px}
.help{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;font-size:13px;color:var(--muted)}
.help div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;line-height:1.6}
.help b{color:var(--ink)}
kbd{font-family:inherit;font-size:11px;background:var(--night);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--ink)}
@media (prefers-reduced-motion:reduce){.mini.shake,.alarm{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header class="hud">
    <div class="hstats">
    <div class="brand">편의점 점장 <span id="hDay" style="font-family:var(--body);font-size:12px;color:var(--muted)">1일차</span></div>
    <div class="stat"><small>시각</small><b id="hClock">08:00</b></div>
    <div class="stat"><small>매출</small><b id="hRev">0원</b></div>
    <div class="stat"><small>순이익</small><b id="hNet">0원</b></div>
    <div class="stat"><small>평점</small><b><span class="stars" id="hStars">★★★☆☆</span> <span id="hRate">3.0</span></b></div>
    <div class="stat"><small>체력</small><div class="stam"><i id="hStam" style="width:100%"></i></div></div>
    </div>
    <div class="hbtns"><button id="fsBtn" type="button" hidden>전체화면</button><button id="pauseBtn" type="button">일시정지</button><button id="muteBtn" type="button">소리 켜짐</button></div>
  </header>

  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="order" id="order" hidden></div>
    <div class="mini" id="mini" hidden></div>
    <div class="banner" id="banner" hidden></div>
    <div class="screen" id="screen"></div>
  </div>
  <div class="hint" id="hint"></div>

  <div class="pad" id="pad">
    <div class="stick" id="stick" role="group" aria-label="이동 패드">
      <span class="ar u">▲</span><span class="ar d">▼</span><span class="ar l">◀</span><span class="ar r">▶</span><i class="knob" id="knob"></i>
    </div>
    <div class="abtns">
      <button type="button" data-k="dash">달리기</button>
      <button type="button" data-k="action">행동</button>
    </div>
  </div>

  <template id="helpTpl">
    <div><b>이동</b> <kbd>WASD</kbd> / <kbd>방향키</kbd><br><b>달리기</b> <kbd>Shift</kbd> (체력 소모)<br><b>행동</b> <kbd>E</kbd> / <kbd>Space</kbd> · 꾹 누르면 진열·걸레질</div>
    <div><b>창고</b>에서 박스를 꺼내 같은 종류 <b>선반</b>에 진열하세요. 품절이면 손님이 화를 냅니다.</div>
    <div><b>계산대</b>에서 방향키로 바코드 스캔, 전자레인지 타이밍, 거스름돈 계산. <kbd>Q</kbd>로 계산을 멈추고 도둑을 쫓을 수 있어요.</div>
    <div><b>도둑</b>은 평범한 손님처럼 들어와요. 물건 앞에서 두리번거리다 계산대가 아니라 <b>출구로 슬금슬금</b> 가면 의심하세요. 가까이 가면 <b style="color:var(--tag)">!</b>를 띄우고 달아나요. 몸으로 막아서 잡으세요.</div>
    <div><b>난이도와 알바</b> · 시작 화면과 마감 정산 화면에서 난이도(쉬움·보통·어려움)를 고르고, 계산·진열·매장 알바를 고용할 수 있어요. 일당은 그날 순이익에서 빠져요.</div>
    <div><b>점포 투자</b> · 마감 정산 화면에서 번 돈으로 운동화, 대용량 박스, 선반 확장, 고속 스캐너, CCTV를 살 수 있어요.</div>
    <div><b>돌발 이벤트</b> · 🚚 <b>물류 입고</b>: 입구 박스를 창고의 같은 칸에 넣으면 무료 박스로 적립. 🛵 <b>배달 주문</b>: 선반을 돌며 담아 라이더에게. 🍺 <b>취객</b>: E로 달래서 입구까지 데리고 나가세요.</div>
  </template>
</div>

<script>
(() => {
const W = 960, H = 600;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const DPR = Math.min(2, window.devicePixelRatio || 1);
cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

const CATS = ['dosirak', 'ramen', 'snack', 'drink'];
const NAME = { dosirak: '도시락', ramen: '라면', snack: '과자', drink: '음료' };
const ICON = { dosirak: '🍱', ramen: '🍜', snack: '🍪', drink: '🥤' };
const PRICE = { dosirak: 4500, ramen: 1500, snack: 1800, drink: 1600 };
let MAXSTOCK = 12, BOX = 8; // set per day from upgrades
const WHOLESALE = 0.55;
// hard = original v0.3 tuning; lower levels slow customers, soften penalties, stretch event timers
const DIFF = {
  easy: { name: '쉬움', desc: '손님이 여유롭고 실수에 너그러워요', spawn: 1.5, drain: 0.55, penalty: 0.5, timer: 1.6, thief: 0.4, growth: 0.06 },
  normal: { name: '보통', desc: '적당히 바쁜 하루', spawn: 1.2, drain: 0.8, penalty: 0.75, timer: 1.25, thief: 0.75, growth: 0.1 },
  hard: { name: '어려움', desc: '쉴 틈 없는 러시', spawn: 1, drain: 1, penalty: 1, timer: 1, thief: 1, growth: 0.15 },
};

function bfs(a, b) {
  if (a === b) return [];
  const prev = { [a]: null }, q = [a];
  while (q.length) {
    const n = q.shift(); if (n === b) break;

  while (n !== a) { p.unshift(n); n = prev[n]; }

}

const SAVE_KEY = 'csm-save-v1', CODE_PREFIX = 'CSM1-';

const freshSave = () => ({ day: 1, rating: 3, bank: 0, up: NO_UPGRADES(), staff: NO_STAFF(), diff: 'easy', stock: START_STOCK(), free: Object.fromEntries(CATS.map(c => [c, 0])) });
function cleanSave(o) {
  if (!o || typeof o !== 'object') return null;
  const n = (v, lo, hi, d) => typeof v === 'number' && isFinite(v) ? clamp(v, lo, hi) : d;
  const s = freshSave();
  s.day = Math.floor(n(o.day, 1, 9999, 1));
  s.rating = n(o.rating, 0, 5, 3);
  s.bank = Math.round(n(o.bank, -1e9, 1e9, 0));
  if (DIFF[o.diff]) s.diff = o.diff;
  for (const u of UPGRADES) s.up[u.id] = Math.floor(n(o.up?.[u.id], 0, u.costs.length, 0));
  for (const st of STAFF) s.staff[st.id] = !!o.staff?.[st.id];
  for (const c of CATS) { s.stock[c] = Math.floor(n(o.stock?.[c], 0, 16, s.stock[c])); s.free[c] = Math.floor(n(o.free?.[c], 0, 99, 0)); }
  return s;
}
function loadSave() {
  try { return cleanSave(JSON.parse(localStorage.getItem(SAVE_KEY))) || freshSave(); } catch (e) { return freshSave(); }
}
function storeSave() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(savedDay)); } catch (e) { /* private mode: play on without saving */ } }

// virtual joystick: 8 directions for walking, dominant axis only during checkout scans
const stick = document.getElementById('stick'), knob = document.getElementById('knob');
let stickId = null;
function stickSet(e) {
  const r = stick.getBoundingClientRect();
  let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  const m = Math.hypot(dx, dy), lim = r.width * 0.32;
  if (m > lim) { dx = dx / m * lim; dy = dy / m * lim; }
  knob.style.transform = `translate(${dx}px, ${dy}px)`;
  const want = { up: false, down: false, left: false, right: false };
  if (m > r.width * 0.12) {
    const cos = dx / Math.hypot(dx, dy), sin = dy / Math.hypot(dx, dy);
    if (G && G.mini) {
      if (Math.abs(cos) > Math.abs(sin)) want[cos > 0 ? 'right' : 'left'] = true; else want[sin > 0 ? 'down' : 'up'] = true;
    } else {
      if (cos > 0.38) want.right = true; if (cos < -0.38) want.left = true;
      if (sin > 0.38) want.down = true; if (sin < -0.38) want.up = true;
    }
  }
  for (const k in want) {
    if (want[k] && !held[k]) { held[k] = true; press(k); }
    else if (!want[k]) held[k] = false;
  }
}
function stickEnd(e) {
  if (e.pointerId !== stickId) return;
  stickId = null; knob.style.transform = '';
  held.up = held.down = held.left = held.right = false;
}

function press(k) {
  if (mode === 'paused' && (k === 'pause' || k === 'action')) { resume(); return; }
  if (mode !== 'play') return;
  if (k === 'pause') { pause(); return; }
  if (G.mini) { miniPress(k); return; }
  if (k === 'action' && G.target) {
    const t = G.target;
    if (t.type === 'pos') startCheckout(G.queue[0]);
    else if (t.type === 'crate') crateAction(t.cat);
    else if (t.type === 'shipbox') { G.ship.boxes.splice(G.ship.boxes.indexOf(t.b), 1); G.carry = { kind: 'ship', cat: t.b.cat }; SFX.box(); }
    else if (t.type === 'drop') {
      G.drops.splice(G.drops.indexOf(t.d), 1);
      if (G.stock[t.d.cat] < MAXSTOCK) G.stock[t.d.cat]++;
      float(G.player.x, G.player.y - 40, `${NAME[t.d.cat]} 제자리에!`, '#9fe8c9'); SFX.tick();
    }
    else if (t.type === 'escort') escort(t.c);
    else if (t.type === 'orderpick') orderPick(t.cat);
    else if (t.type === 'deliver') deliverOrder();
  }
}

// ---------- player actions ----------
function crateAction(cat) {
  const p = G.player;
  if (G.carry && G.carry.kind === 'ship') {
    if (G.carry.cat !== cat) { float(p.x, p.y - 40, `${NAME[G.carry.cat]} 칸에 넣어야 해요`, '#ffb4b4'); SFX.err(); return; }
    G.free[cat]++; G.carry = null; G.stats.shipBoxes++; SFX.box();
    float(p.x, p.y - 40, `${NAME[cat]} 입고! 무료 박스 +1`, '#9fe8c9');
    return;
  }
  if (G.carry) {
    if (G.carry.free) { if (G.carry.n === BOX) G.free[G.carry.cat]++; }
    else G.cost -= Math.round(G.carry.n * PRICE[G.carry.cat] * WHOLESALE / 100) * 100;
    if (G.carry.cat === cat) { float(p.x, p.y - 40, `${NAME[cat]} 박스 반납`, '#9fe8c9'); G.carry = null; SFX.box(); return; }
  }
  if (G.free[cat] > 0) {
    G.free[cat]--; G.carry = { kind: 'box', cat, n: BOX, free: true }; SFX.box();
    float(p.x, p.y - 40, `${NAME[cat]} 입고분 박스 (무료)`, '#9fe8c9');
    return;
  }
  const cost = Math.round(BOX * PRICE[cat] * WHOLESALE / 100) * 100;
  G.cost += cost; G.carry = { kind: 'box', cat, n: BOX }; SFX.box();
  float(p.x, p.y - 40, `${NAME[cat]} 박스 -${won(cost)}`, '#ffb4b4');
}

function findTarget() {
  const p = G.player;
  const cb = G.carry && G.carry.kind === 'box' ? G.carry : null, cs = G.carry && G.carry.kind === 'ship' ? G.carry : null;
  if (dist(p.x, p.y, ...POS_SPOT) < 52) {
    const h = G.queue[0];
    if (h && h.atSlot) return { type: 'pos', label: '<b>[E]</b> 계산하기' };
    return { type: 'none', label: '계산대 · 손님을 기다리는 중' };
  }
  const o = G.order;
  if (o && dist(p.x, p.y, o.rider.x, o.rider.y) < 46) {
    if (o.items.every(i => i.got)) return { type: 'deliver', label: '<b>[E]</b> 라이더에게 배달 봉투 전달' };
    return { type: 'none', label: `라이더: "아직 ${o.items.filter(i => !i.got).length}개 남았어요, 빨리요!"` };
  }
  for (const c of G.customers) if (c.drunk && c.state === 'wander' && dist(p.x, p.y, c.x, c.y) < 40) return { type: 'escort', c, label: '<b>[E]</b> 취객 달래서 데리고 나가기' };
  for (const d of G.drops) if (dist(p.x, p.y, d.x, d.y) < 30) return { type: 'drop', d, label: `<b>[E]</b> 떨어진 ${NAME[d.cat]} 줍기` };
  if (G.ship && !G.carry) for (const b of G.ship.boxes) if (dist(p.x, p.y, b.x, b.y) < 32) return { type: 'shipbox', b, label: `<b>[E]</b> 입고 박스 들기 (${NAME[b.cat]})` };
  for (const pd of G.puddles) if (dist(p.x, p.y, pd.x, pd.y) < 38) return { type: 'clean', pd, label: '<b>[E 꾹]</b> 걸레질하기' };
  for (const c of CATS) {
    if (distRect(p.x, p.y, SHELF[c]) < 34) {
      if (o && G.stock[c] > 0 && o.items.some(i => !i.got && i.cat === c)) return { type: 'orderpick', cat: c, label: `<b>[E]</b> 배달 주문용 ${NAME[c]} 담기` };
      if (cs) return { type: 'none', label: '입고 박스는 창고로 옮겨야 해요' };
      if (cb && cb.cat === c) {
        if (G.stock[c] >= MAXSTOCK) return { type: 'none', label: `${NAME[c]} 선반이 가득 찼어요` };
        return { type: 'restock', cat: c, label: `<b>[E 꾹]</b> ${NAME[c]} 진열하기 (박스 ${cb.n}개 남음)` };
      }
      if (cb) return { type: 'none', label: `여긴 ${NAME[c]} 선반이에요. ${NAME[cb.cat]}은(는) 다른 곳에!` };
      return { type: 'none', label: `${NAME[c]} 재고 ${G.stock[c]}/${MAXSTOCK} · 창고에서 박스를 가져오세요` };
    }
  }
  for (const c of CATS) {
    if (distRect(p.x, p.y, CRATE[c]) < 30) {
      if (cs) return cs.cat === c ? { type: 'crate', cat: c, label: `<b>[E]</b> ${NAME[c]} 칸에 입고하기` } : { type: 'none', label: `이 박스는 ${NAME[cs.cat]} 칸에 넣어주세요` };
      if (cb && cb.cat === c) return { type: 'crate', cat: c, label: `<b>[E]</b> ${NAME[c]} 박스 반납` };
      if (G.free[c] > 0) return { type: 'crate', cat: c, label: `<b>[E]</b> ${NAME[c]} 박스 꺼내기 (입고분 무료, ${G.free[c]}개 남음)` };
      const cost = Math.round(BOX * PRICE[c] * WHOLESALE / 100) * 100;
      return { type: 'crate', cat: c, label: `<b>[E]</b> ${NAME[c]} 박스 꺼내기 (${BOX}개, 원가 ${won(cost)})` };
    }
  }
  return null;
}

function spawnCustomer() {

  wants.sort((a, b) => ['dosirak', 'drink', 'ramen', 'snack'].indexOf(a) - ['dosirak', 'drink', 'ramen', 'snack'].indexOf(b));
  const [x, y] = NODES.door;
  G.customers.push({
    x, y: y + 30, node: 'door', path: [], direct: null, state: 'shop', wants, wi: 0, cart: [], thief,
    patience: 100, speed: rnd(75, 100), shirt: pick(SHIRTS), pants: pick(PANTS), skin: pick(SKINS),
    cap: Math.random() < (thief ? 0.6 : 0.15), lookT: 0,
    hair: pick(['#2b1d14', '#4a3222', '#111', '#7a5230']), bubble: null, waitT: 0, stun: 0, slipped: new Set(),
    wantHeat: Math.random() < 0.6, line: pick(LINES), walk: Math.random() * 6, face: -1,
  });
  SFX.chime();
}
function stepTo(c, tx, ty, sp, dt) {
  const dx = tx - c.x, dy = ty - c.y, d = Math.hypot(dx, dy);
  if (d <= sp * dt) { c.x = tx; c.y = ty; return true; }
  c.x += dx / d * sp * dt; c.y += dy / d * sp * dt; c.walk += dt * 10;
  if (Math.abs(dx) > 1) c.face = Math.sign(dx);
  return false;
}
function follow(c, dt) {
  if (c.stun > 0) { c.stun -= dt; return false; }
  const sp = c.speed * (c.state === 'flee' ? 1.45 : 1);
  if (c.direct) {
    if (stepTo(c, c.direct[0], c.direct[1], sp, dt)) { c.direct = null; if (c.directNode) { c.node = c.directNode; c.directNode = null; } }
    return false;
  }
  if (c.path.length) {
    const n = c.path[0], p = NODES[n];
    if (stepTo(c, p[0], p[1], sp, dt)) { c.node = n; c.path.shift(); }
    return false;
  }
  return true;
}
function leaveStore(c, fromQueue) {
  c.state = 'leave';
  if (fromQueue) { c.direct = [400, 385]; c.directNode = 'bl'; c.path = bfs('bl', 'door'); }
  else c.path = bfs(c.node, 'door');
}
function angry(c, msg, fromQueue) {
  rate(-0.1); G.stats.angry++; c.bubble = '😡';
  float(c.x, c.y - 40, msg, '#ff9a9a'); SFX.bad();

  leaveStore(c, fromQueue);
}
function caught(c) {
  G.stats.caught++; rate(0.15);
  c.cart.forEach(cat => { if (G.stock[cat] < MAXSTOCK) G.stock[cat]++; });
  c.cart = []; c.thief = false; c.bubble = '😰'; c.speed *= 0.7; c.stun = 0.8;
  float(c.x, c.y - 44, '도둑 검거! 물건 회수', '#ffd166'); SFX.good(); burst(c.x, c.y, '#ffd166', 14, 1.2); G.shake = 0.35;
  c.state = 'leave';
  if (!c.path.length) c.path = bfs(c.node, 'door');
}
function clerkServe(c) {
  const total = cartTotal(c);
  G.revenue += total; G.stats.served++; G.stats.clerkServed++; rate(0.03);
  float(c.x, c.y - 44, `알바 계산 +${won(total)}`, '#ffd166'); SFX.coin(); burst(c.x, c.y, '#ffd166', 6);
  G.queue.splice(G.queue.indexOf(c), 1); c.atSlot = false; c.cart = []; c.bubble = '🙂';
  leaveStore(c, true);
}

// ---------- part-timers ----------
function makeHelpers(staff) {
  const npc = (x, y, node, shirt, label) => ({ x, y, node, path: [], direct: null, directNode: null, speed: 95, walk: 0, face: 1, stun: 0, state: 'helper', job: 'idle', t: 0, shirt, label });
  return {
    stocker: staff.stocker ? npc(400, 105, 'ul', '#ffe08a', '진열') : null,
    floor: staff.floor ? npc(760, 470, 'lr', '#a8dadc', '매장') : null,
  };
}
function updateStocker(n, dt) {
  if (n.job === 'idle') {
    const low = CATS.filter(c => G.stock[c] <= 3).sort((a, b) => G.stock[a] - G.stock[b])[0];
    if (low) { n.job = 'go'; n.cat = low; n.path = bfs(n.node, 's_' + low); return; }
    if (!n.path.length && n.node !== 'ul') n.path = bfs(n.node, 'ul');
    follow(n, dt);
  } else if (n.job === 'go') {
    if (follow(n, dt)) { n.job = 'fill'; n.t = 0; }
  } else if (n.job === 'fill' && (n.t += dt) >= 1.5) {
    const add = Math.min(BOX, MAXSTOCK - G.stock[n.cat]);
    if (add > 0) {
      if (G.free[n.cat] > 0) G.free[n.cat]--;
      else G.cost += Math.round(add * PRICE[n.cat] * WHOLESALE / 100) * 100;
      G.stock[n.cat] += add;
      float(n.x, n.y - 40, `알바가 ${NAME[n.cat]} 진열`, '#9fe8c9');
    }
    n.job = 'idle';
  }
}
// helpers go straight only when nothing is in the way; otherwise they take the aisle graph like customers
function clearLine(ax, ay, bx, by) {
  const k = Math.ceil(dist(ax, ay, bx, by) / 10);
  for (let i = 1; i <= k; i++) {
    const x = ax + (bx - ax) * i / k, y = ay + (by - ay) * i / k;
    if (OBST.some(o => distRect(x, y, o) < 12)) return false;
  }
  return true;
}
function seenNode(x, y) {
  const ks = Object.keys(NODES).sort((a, b) => dist(x, y, ...NODES[a]) - dist(x, y, ...NODES[b]));
  return ks.find(k => clearLine(x, y, ...NODES[k])) || ks[0];
}
function navTo(n, tx, ty, sp, dt) {
  tx = clamp(tx, 34, 926); ty = clamp(ty, 34, 566);
  if (clearLine(n.x, n.y, tx, ty)) { n.route = null; return stepTo(n, tx, ty, sp, dt); }
  const goal = seenNode(tx, ty);
  if (!n.route || n.routeGoal !== goal) { const start = seenNode(n.x, n.y); n.route = [start, ...bfs(start, goal)]; n.routeGoal = goal; }
  if (!n.route.length) return stepTo(n, tx, ty, sp, dt);
  if (stepTo(n, ...NODES[n.route[0]], sp, dt)) n.route.shift();
  return false;
}
const onFloor = (x, y) => x > 34 && x < 926 && y > 34 && y < 566 && !OBST.some(o => distRect(x, y, o) < 10);
function updateFloor(n, dt) {
  const thief = G.customers.find(c => c.state === 'sneak' || c.state === 'flee');
  if (thief) {
    navTo(n, thief.x, thief.y, n.speed * 1.3, dt);
    if (dist(n.x, n.y, thief.x, thief.y) < 30) { caught(thief); float(n.x, n.y - 44, '알바가 도둑을 잡았다!', '#ffd166'); }
    return;
  }
  const tgt = n.tgt && (G.puddles.includes(n.tgt) || G.drops.includes(n.tgt)) ? n.tgt : [...G.puddles, ...G.drops][0];
  if (tgt !== n.tgt) { n.tgt = tgt; n.t = 0; }
  if (!tgt) { navTo(n, 760, 470, n.speed, dt); return; }
  if (!navTo(n, tgt.x, tgt.y, n.speed, dt)) return;
  if ((n.t += dt) < (tgt.r ? 2 : 0.6)) return;
  if (tgt.r) { G.puddles.splice(G.puddles.indexOf(tgt), 1); G.stats.cleaned++; float(tgt.x, tgt.y - 20, '알바가 닦았어요', '#9fe8c9'); }
  else { G.drops.splice(G.drops.indexOf(tgt), 1); if (G.stock[tgt.cat] < MAXSTOCK) G.stock[tgt.cat]++; }
  n.tgt = null;
}
function spawnPuddle(x, y) {
  if (G.puddles.length >= 4 || !onFloor(x, y)) return;
  G.puddles.push({ x, y, r: rnd(20, 28), clean: 0, seed: Math.random() * 10 });
  float(x, y - 20, '앗! 음료를 쏟았다', '#9ad7ff'); SFX.splash(); burst(x, y, '#7cc4f2', 8, 0.7);
}

// ---------- events: shipments, delivery orders, drunks ----------
function makeEvents(day) {
  const ev = [{ t: 600, type: 'ship' }, { t: 930, type: 'ship' }, { t: 1170, type: 'drunk' }, { t: 1260, type: 'drunk' }];
  if (day >= 2) ev.push({ t: 1215, type: 'drunk' });
  for (let t = 650 + rnd(0, 40); t < 1250; t += Math.max(60, rnd(85, 120) - day * 6)) ev.push({ t, type: 'order' });
  return ev.sort((a, b) => a.t - b.t);
}
function runEvents() {
  if (G.closed) return;
  for (const ev of G.events) {
    if (ev.done || G.time < ev.t) continue;
    if (ev.type === 'order' && G.order) { ev.t += 20; continue; }
    if (ev.type === 'ship' && G.ship) { ev.t += 30; continue; }
    ev.done = true;
    if (ev.type === 'ship') startShipment();
    else if (ev.type === 'order') startOrder();
    else spawnDrunk();
  }
}
function showBanner(txt) { G.banner = { txt, t: 3.2 }; }
function startShipment() {
  const n = Math.min(6, 3 + G.day), boxes = [];
  for (let i = 0; i < n; i++) boxes.push({ cat: pick(CATS), x: 575 + (i % 4) * 40, y: 522 + Math.floor(i / 4) * 34 });

}
function shipDone() {

function startOrder() {

function orderPick(cat) {

function failOrder() {

function spawnDrunk() {
  const [x, y] = NODES.door;
  G.customers.push({
    x, y: y + 30, node: 'door', path: [], direct: null, state: 'wander', drunk: true, wants: [], wi: 0, cart: [], thief: false,
    patience: 100, speed: rnd(50, 65), shirt: '#6d597a', skin: '#f1a98f', hair: '#3a2a20', bubble: '🍺', waitT: 0, stun: 0,

  });
  SFX.chime(); showBanner('🍺 취객 등장! 달래서 밖으로 데리고 나가세요');

function nearestNode(c) {
  let best = 'door', bd = Infinity;
  for (const k in NODES) { const d = dist(c.x, c.y, ...NODES[k]); if (d < bd) { bd = d; best = k; } }
  return best;
}
function escort(c) {
  c.state = 'follow'; c.bubble = '🥴'; c.path = []; c.direct = null; c.lostT = 0;
  float(c.x, c.y - 44, pick(['어~ 점장님~ 어디 가요~', '한 잔만 더~', '알았어 알았어~']), '#e0c3ff'); SFX.tick();
}
function updateCustomer(c, dt) {
  const drain = 2.8 * G.diff.drain * (1 + G.diff.growth * 0.8 * (G.day - 1));
  switch (c.state) {
    case 'shop': {
      if (c.wi >= c.wants.length) {
        // thieves blend in, then sneak toward the exit instead of the queue
        if (c.thief && c.cart.length) { c.state = 'sneak'; c.path = bfs(c.node, 'door'); c.bubble = null; c.lookT = 0; break; }
        if (!c.cart.length) { angry(c, '살 게 하나도 없네!'); break; }
        c.state = 'toQueue'; c.bubble = null; c.path = bfs(c.node, 'bl'); break;
      }
      const spot = 's_' + c.wants[c.wi];
      c.bubble = ICON[c.wants[c.wi]];
      if (c.node !== spot && !c.path.length && !c.direct) c.path = bfs(c.node, spot);
      if (follow(c, dt) && c.node === spot) { c.state = 'pick'; c.waitT = 0; }
      break;
    }
    case 'pick': {
      c.waitT += dt;
      const cat = c.wants[c.wi];
      if (c.thief && (c.lookT += dt) > 0.35) { c.lookT = 0; c.face = -c.face; }
      if (c.waitT > (c.thief ? 1.4 : 0.6)) {
        if (G.stock[cat] > 0) {
          G.stock[cat]--; c.cart.push(cat); c.wi++; c.state = 'shop'; c.bubble = null;
          if (cat === 'drink' && Math.random() < 0.18) spawnPuddle(rnd(700, 850), rnd(236, 282));
          else if (Math.random() < 0.03) spawnPuddle(c.x + rnd(-30, 30), c.y + rnd(20, 30));
        } else {
          c.bubble = '?'; c.patience -= 7 * dt;
          if (c.waitT > 6.5) { c.wi++; c.state = 'shop'; c.patience -= 15; rate(-0.05); float(c.x, c.y - 40, `${NAME[cat]} 품절이라니…`, '#ffb4b4'); }
        }
      }
      break;
    }
    case 'toQueue':
      if (follow(c, dt)) { G.queue.push(c); c.state = 'queue'; c.line = pick(LINES); }
      break;
    case 'queue': {
      const i = G.queue.indexOf(c), [sx, sy] = slotPos(i);
      c.atSlot = stepTo(c, sx, sy, c.speed, dt) && i === 0;
      if (i === 0) c.face = -1;
      const serving = G.mini && G.mini.c === c;
      c.patience -= drain * dt * (serving ? (G.up.scanner ? 0.1 : 0.35) : 1) * (i === 0 ? 1 : 0.6);
      if (c.patience <= 0 && !serving) { G.queue.splice(i, 1); c.atSlot = false; angry(c, '너무 오래 기다렸어요!', true); }
      break;
    }
    case 'wander': {
      if (follow(c, dt)) {
        c.idleT += dt;
        if (c.idleT > 1.4) {
          c.idleT = 0;
          const cat = c.node.startsWith('s_') ? c.node.slice(2) : null;
          if (cat && G.stock[cat] > 0 && Math.random() < 0.65) {
            const k = Math.min(G.stock[cat], Math.random() < 0.4 ? 2 : 1);
            for (let i = 0; i < k; i++) {
              let x = c.x + rnd(-24, 24), y = c.y + rnd(14, 30);
              if (!onFloor(x, y)) { x = c.x; y = c.y + 12; }
              G.stock[cat]--; G.drops.push({ cat, x, y, rot: rnd(-0.6, 0.6) });
            }
            float(c.x, c.y - 44, '와장창!', '#ffb4b4'); SFX.err();
          } else if (Math.random() < 0.3) spawnPuddle(c.x + rnd(-20, 20), c.y + rnd(16, 26));
          else float(c.x, c.y - 44, pick(['♪ 술이 술술~', '딸꾹!', '여기 노래방 아니에요?', '점장님 최고~']), '#e0c3ff');
          c.path = bfs(c.node, pick(['ur', 'ul', 'ml', 'mr', 'bl', 'br', 's_dosirak', 's_ramen', 's_snack', 's_drink']));
        }
      }
      c.annoyT += dt;
      if (c.annoyT > 1) {
        c.annoyT = 0; rate(-0.004);
        G.customers.forEach(o => { if (o !== c && !o.drunk && dist(o.x, o.y, c.x, c.y) < 90) o.patience -= 3; });
      }
      break;
    }
    case 'follow': {
      const p = G.player, d = dist(p.x, p.y, c.x, c.y);
      if (d > 42) stepTo(c, p.x, p.y, c.speed * 1.6, dt);
      if (c.y > 500 && c.x > 730 && c.x < 900) {
        c.state = 'leave'; c.bubble = '👋'; c.path = []; c.direct = [...NODES.door]; c.directNode = 'door';
        G.stats.drunkOut++; rate(0.06); float(c.x, c.y - 44, '조심히 들어가세요~', '#9fe8c9'); SFX.good();
      } else if (d > 230) {
        c.lostT += dt;
        if (c.lostT > 2) { c.state = 'wander'; c.bubble = '🍺'; c.node = nearestNode(c); c.direct = [...NODES[c.node]]; c.directNode = c.node; c.lostT = 0; }
      } else c.lostT = 0;
      break;
    }
    case 'leave':
      if (follow(c, dt) && c.node === 'door') c.dead = true;
      break;
    case 'sneak': {
      const p = G.player, d = dist(p.x, p.y, c.x, c.y);
      if (d < 30) { caught(c); break; }
      if (d < 110 || c.node === 'lr' || c.node === 'door') {
        c.state = 'flee'; c.bubble = '!'; SFX.alarm(); G.shake = Math.max(G.shake, 0.25); float(c.x, c.y - 44, '도둑이야!', '#ff6b6b');
        if (!c.path.length) c.path = bfs(c.node, 'door');
        break;
      }
      const sp0 = c.speed; c.speed = sp0 * 0.8; follow(c, dt); c.speed = sp0;
      if ((c.lookT += dt) > 0.45) { c.lookT = 0; c.face = -c.face; }
      break;
    }
    case 'flee': {
      const p = G.player;
      if (dist(p.x, p.y, c.x, c.y) < 30) { caught(c); break; }
      if (follow(c, dt) && c.node === 'door') {
        c.dead = true; G.stats.stolen++; G.shake = 0.5;
        const loss = c.cart.reduce((s, k) => s + PRICE[k], 0);
        G.lost += loss; rate(-0.12);
        float(820, 520, `도둑맞았다… -${won(loss)}`, '#ff6b6b'); SFX.bad();
      }
      break;
    }
  }
  if (c.state === 'shop' || c.state === 'pick' || c.state === 'toQueue') c.patience -= 0.6 * dt;
  // slipping on puddles
  for (const pd of G.puddles) {
    if (!c.slipped.has(pd) && dist(c.x, c.y, pd.x, pd.y) < pd.r) {
      c.slipped.add(pd); c.stun = 0.9; c.patience -= 15; G.stats.slips++; rate(-0.04);
      float(c.x, c.y - 40, '미끄덩!', '#9ad7ff'); SFX.splash();
    }
  }
}

// ---------- checkout mini-game ----------
const miniEl = document.getElementById('mini');
function startCheckout(c) {
  if (!c) return;
  const keys = ['up', 'down', 'left', 'right'];
  const items = [];
  c.cart.forEach(cat => { items.push({ cat, key: pick(keys) }); });
  G.mini = { c, phase: 'scan', items, idx: 0, lock: 0, t: 0, errors: 0, heatT: 0, msg: '' };
  renderMini();
}
function cartTotal(c) { return c.cart.reduce((s, k) => s + PRICE[k], 0); }
function nextPhase() {
  const m = G.mini;
  if (m.phase === 'scan' && m.c.cart.includes('dosirak') && m.c.wantHeat) {
    m.phase = 'heat'; m.heatT = 0; m.zone = rnd(0.5, 0.74); m.hspeed = rnd(2.4, 3.4) * (1 + 0.08 * (G.day - 1));
  } else if (m.phase === 'scan' || m.phase === 'heat') {
    m.phase = 'pay';
    const total = cartTotal(m.c);
    if (Math.random() < 0.5) m.pay = { type: 'card' };
    else {
      let given = total <= 5000 && Math.random() < 0.6 ? 5000 : total <= 10000 ? 10000 : total <= 20000 && Math.random() < 0.5 ? 20000 : 50000;
      if (given < total) given = 50000;
      const ch = given - total;
      const pool = [ch + 1000, ch - 1000, ch + 500, ch - 500, ch + 100, ch - 100].filter(v => v >= 0 && v !== ch);
      const opts = [ch];
      while (opts.length < 3) { const v = pick(pool); if (!opts.includes(v)) opts.push(v); }
      opts.sort(() => Math.random() - 0.5);
      m.pay = { type: 'cash', given, ch, opts };
    }
  }
  renderMini();
}
function miniPress(k) {
  const m = G.mini;
  if (k === 'cancel') { G.mini = null; renderMini(); return; }
  if (m.lock > 0) return;
  if (m.phase === 'scan') {
    if (!ARW[k]) return;
    if (k === m.items[m.idx].key) { m.idx++; SFX.scan(); if (m.idx >= m.items.length) nextPhase(); else renderMini(); }
    else { m.errors++; m.lock = G.up.scanner ? 0.15 : 0.45; SFX.err(); renderMini(true); }
  } else if (m.phase === 'heat') {
    if (k !== 'action') return;
    const pos = heatPos(m);
    if (pos >= m.zone && pos <= m.zone + 0.14) { m.perfectHeat = true; m.msg = '딱 알맞게 데웠다!'; SFX.good(); }
    else if (pos > m.zone + 0.14) { m.burnt = true; m.msg = '앗 뜨거! 너무 데웠어요'; SFX.bad(); }

// ---------- update ----------
function update(dt) {
  G.time += dt * 4;
  if (G.time >= 22 * 60 && !G.closed) { G.closed = true; float(820, 520, '22:00 영업 종료', '#ffd166'); }
  if (!G.closed) {
    G.spawnT -= dt;
    if (G.spawnT <= 0) {
      const h = G.time / 60;
      const rush = (h >= 11.5 && h < 13.5) || (h >= 17.5 && h < 20);
      const base = (rush ? 2.4 : 5.2) / (1 + G.diff.growth * (G.day - 1));
      G.spawnT = base * G.diff.spawn * rnd(0.7, 1.3);
      if (G.customers.length < 12) spawnCustomer();
    }
  }
  runEvents();
  if (G.banner && (G.banner.t -= dt) <= 0) G.banner = null;
  if (G.order && (G.order.t -= dt) <= 0) failOrder();
  if (G.ship) {
    G.ship.t -= dt;
    if (G.ship.t <= 0 && !G.ship.late) { G.ship.late = true; rate(-0.1); showBanner('기사님: "박스 좀 빨리 치워주세요!"'); SFX.bad(); }
    if (!G.ship.boxes.length && !(G.carry && G.carry.kind === 'ship')) shipDone();
  }
  // player
  const p = G.player;
  let mx = 0, my = 0;
  if (!G.mini) {
    if (held.left) mx -= 1; if (held.right) mx += 1; if (held.up) my -= 1; if (held.down) my += 1;
  }
  const moving = mx || my;
  const dashing = held.dash && moving && p.stam > 0.02;
  p.stam = clamp(p.stam + (dashing ? -0.45 : 0.22) * dt, 0, 1);
  const inPuddle = G.puddles.some(pd => dist(p.x, p.y, pd.x, pd.y) < pd.r);
  let sp = 210 * (1 + 0.12 * G.up.shoes) * (dashing ? 1.7 : 1) * (inPuddle ? 0.55 : 1) * (G.carry && G.carry.kind === 'ship' ? 0.9 : 1);
  if (moving) {
    const l = Math.hypot(mx, my); mx /= l; my /= l;
    if (mx) p.face = Math.sign(mx);
    p.walk += dt * (dashing ? 16 : 11);
    const R = 14;
    const nx = clamp(p.x + mx * sp * dt, 20 + R, 940 - R);
    if (!OBST.some(o => distRect(nx, p.y, o) < R)) p.x = nx;
    const ny = clamp(p.y + my * sp * dt, 20 + R, 580 - R);
    if (!OBST.some(o => distRect(p.x, ny, o) < R)) p.y = ny;
  }
  // interaction
  G.target = G.mini ? null : findTarget();
  const t = G.target;
  if (held.action && t && t.type === 'restock') {
    G.holdT += dt;
    while (G.holdT > 0.16 && G.carry && G.carry.n > 0 && G.stock[t.cat] < MAXSTOCK) {
      G.holdT -= 0.16; G.carry.n--; G.stock[t.cat]++; SFX.tick();
    }
    if (G.carry && G.carry.n <= 0) { G.carry = null; float(p.x, p.y - 40, '진열 완료!', '#9fe8c9'); }
  } else if (held.action && t && t.type === 'clean') {
    t.pd.clean += dt;
    if (Math.random() < dt * 8) SFX.tick();
    if (t.pd.clean >= 1.1) { G.puddles.splice(G.puddles.indexOf(t.pd), 1); G.stats.cleaned++; rate(0.02); float(t.pd.x, t.pd.y - 20, '반짝반짝!', '#9fe8c9'); SFX.good(); burst(t.pd.x, t.pd.y, '#ffffff', 10); }
  } else G.holdT = 0;
  // part-timer covers the register while the player is away from it
  if (G.staff.cashier && !G.mini) {
    const h = G.queue[0];
    if (h && h.atSlot && dist(p.x, p.y, ...POS_SPOT) > 60) {
      if ((G.clerkT += dt) >= 4) { G.clerkT = 0; clerkServe(h); }
    } else G.clerkT = 0;
  }
  if (G.helpers.stocker) updateStocker(G.helpers.stocker, dt);
  if (G.helpers.floor) updateFloor(G.helpers.floor, dt);
  // customers
  G.customers.forEach(c => updateCustomer(c, dt));
  G.customers = G.customers.filter(c => !c.dead);
  G.floats.forEach(f => f.t += dt);
  G.fx.forEach(f => { f.t += dt; f.x += f.vx * dt; f.y += f.vy * dt; f.z += f.vz * dt; f.vz -= 420 * dt; if (f.z < 0) { f.z = 0; f.vz *= -0.35; f.vx *= 0.6; f.vy *= 0.6; } });
  G.fx = G.fx.filter(f => f.t < f.life);
  G.shake = Math.max(0, G.shake - dt);
  G.floats = G.floats.filter(f => f.t < 1.6);
  if (G.mini) { G.mini.lock -= dt; G.mini.heatT += dt; G.mini.t += dt; if (G.mini && !G.queue.includes(G.mini.c)) { G.mini = null; renderMini(); } else updateMiniLive(); }
  if ((G.closed && !G.customers.some(c => !c.drunk) && !G.mini) || G.time >= 23 * 60) endDay();
}

  mode = 'report'; G.mini = null; renderMini();
  G.order = null; G.banner = null; hud();
  const drunks = G.customers.filter(c => c.drunk && c.state !== 'leave').length;
  if (drunks) { G.stats.drunkLeft = drunks; rate(-0.1 * drunks); }
  const net = G.revenue - G.cost - G.lost - G.wage;
  const r = G.rating;
  const verdict = r >= 4.5 ? '본사: "전국 우수 점포 후보입니다!"' : r >= 3.5 ? '본사: "안정적인 하루였네요. 내일도 부탁해요."' : r >= 2.5 ? '본사: "음… 고객 불만이 조금 들어왔어요."' : '본사: "점장 교육을 다시 받으셔야겠습니다."';
  const s = G.stats;
  savedDay = { day: G.day + 1, rating: G.rating, bank: G.bank + net, up: { ...G.up }, staff: { ...G.staff }, diff: G.diffKey, stock: { ...G.stock }, free: { ...G.free } };
  storeSave();
  screenEl.hidden = false;
  screenEl.innerHTML = `<div class="card">
    <span class="tag">${G.day}일차 마감 정산</span>
    <h2>${'★'.repeat(Math.round(r))}${'☆'.repeat(5 - Math.round(r))} ${r.toFixed(1)}</h2>
    <p>${verdict}</p>
    <dl class="report">
      <dt>매출</dt><dd>${won(G.revenue)}</dd>
      <dt>박스 원가</dt><dd>-${won(G.cost)}</dd>
      <dt>도난·거스름돈 손실</dt><dd>-${won(G.lost)}</dd>
      ${G.wage ? `<dt>알바 일당</dt><dd>-${won(G.wage)}</dd>` : ''}
      <dt class="sum">오늘 순이익</dt><dd class="sum" style="color:${net < 0 ? 'var(--tag)' : 'var(--mint)'}">${won(net)}</dd>
      <dt>누적 통장</dt><dd>${won(savedDay.bank)}</dd>
      <dt>계산한 손님</dt><dd>${s.served}명</dd>
      <dt>화나서 나간 손님</dt><dd>${s.angry}명</dd>
      <dt>도둑 검거 / 놓침</dt><dd>${s.caught} / ${s.stolen}</dd>
      <dt>미끄러진 손님 / 닦은 웅덩이</dt><dd>${s.slips} / ${s.cleaned}</dd>
      <dt>배달 완료 / 취소</dt><dd>${s.orders} / ${s.orderFail}</dd>
      <dt>물류 입고 (박스)</dt><dd>${s.ships}회 (${s.shipBoxes}개)</dd>
      <dt>취객 내보냄 / 마감까지 남음</dt><dd>${s.drunkOut} / ${s.drunkLeft}</dd>
      ${G.staff.cashier ? `<dt>알바가 계산한 손님</dt><dd>${s.clerkServed}명</dd>` : ''}
    </dl>
    <div class="shop" id="shop"></div>
    <div class="shop" id="setup"></div>
    <div class="shop" id="save"></div>
    <button class="btn" id="nextBtn" type="button">${savedDay.day}일차 영업 시작</button>
    <p style="font-size:12px">날이 갈수록 손님이 많아지고 성격이 급해집니다. 재고, 평점, 투자한 설비는 이어집니다. 진행은 자동 저장돼요.</p>
  </div>`;
  renderShop(); renderSetup(); renderSave();
  $('nextBtn').onclick = () => startGame(savedDay);
  $('nextBtn').focus({ preventScroll: true });
}
function renderShop() {
  const el = $('shop'); if (!el) return;
  const bank = savedDay.bank, up = savedDay.up;
  el.innerHTML = `<div class="shop-head"><b>점포 투자</b><span>통장 <b>${won(bank)}</b></span></div>`
    + UPGRADES.map(u => {
      const lv = up[u.id], max = u.costs.length, cost = u.costs[lv], done = lv >= max;
      return `<div class="up${done ? ' owned' : ''}"><div class="up-txt"><b>${u.name}${max > 1 ? ` <small>Lv.${lv}/${max}</small>` : ''}</b><small>${u.desc}</small></div>
        <button type="button" data-up="${u.id}" ${done || bank < cost ? 'disabled' : ''}>${done ? '보유 중' : won(cost)}</button></div>`;
    }).join('');
  el.querySelectorAll('[data-up]').forEach(b => b.onclick = () => {
    const u = UPGRADES.find(x => x.id === b.dataset.up), cost = u.costs[savedDay.up[u.id]];
    if (cost === undefined || savedDay.bank < cost) return;
    savedDay.bank -= cost; savedDay.up[u.id]++; SFX.coin(); storeSave();
    renderShop(); renderSave();
  });
}

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (G) {
    if (mode === 'play') { update(dt); hud(); }
    draw();
  }
  requestAnimationFrame(frame);
}
newDay(savedDay);
showTitle();
requestAnimationFrame(frame);
})();
</script>

</body>
</html>
